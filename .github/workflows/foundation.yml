name: Foundation source checks
on:
  pull_request:
  push:
    branches: [codex/stage-00-foundation]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_repository.py
      - run: git diff --check
