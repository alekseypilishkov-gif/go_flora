name: Stage 01 Godot automatic checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  godot-automatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Godot 4.7.2 runtime
        shell: bash
        run: |
          mkdir -p .scratch/ci-godot
          curl --fail --location --retry 3 --output .scratch/ci-godot/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  .scratch/ci-godot/godot.zip' | sha256sum --check
          unzip -q .scratch/ci-godot/godot.zip -d .scratch/ci-godot
          chmod +x .scratch/ci-godot/Godot_v4.7.2-stable_linux.x86_64
      - run: python tools/prepare_stage01.py
      - name: Headless core, fresh process, native Editor API (not GUI acceptance)
        run: python tools/run_stage01_tests.py --godot .scratch/ci-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Build local addon ZIP (no release publication)
        run: python tools/package_stage01.py
      - name: Standalone ZIP import, scene smoke and update preservation
        run: python tests/test_stage01_package.py --godot .scratch/ci-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Upload automatic evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-godot-automatic
          path: |
            stages/01_painter_mvp/evidence/.scratch/runs/
            stages/01_painter_mvp/evidence/.scratch/test_project/.scratch/core_results.json
            stages/01_painter_mvp/evidence/.scratch/editor_project/.scratch/editor_api_results.json
            stages/01_painter_mvp/.scratch/packages/
            stages/01_painter_mvp/evidence/.scratch/package_tests/**/validation.json
            stages/01_painter_mvp/evidence/.scratch/package_tests/**/*.log
          include-hidden-files: true
